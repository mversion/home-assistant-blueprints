blueprint:
  name: Internet watchdog - power-cycle the modem plug
  description: >
    When Home Assistant can't reach the internet for a while, turns the plug that powers the
    modem/router off, waits, and turns it back on. If the internet still isn't back after the
    recovery time, it tries again, up to the maximum number of quick attempts. After that it can
    keep trying slowly (for example once an hour) for as long as the internet stays down.


    Needs one or more **Ping** binary sensors (Settings > Devices & services > Add integration >
    Ping), for example 1.1.1.1 and 8.8.8.8. The plug is only cycled when **all** of them are
    offline, so one unreachable server doesn't restart the modem.


    The plug must power the modem/router only, never the Home Assistant box itself. Set the
    plug's power-on behaviour to **Previous** (not On).
  domain: automation
  author: mversion
  source_url: https://github.com/mversion/home-assistant-blueprints/blob/main/internet-watchdog-plug.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    internet_sensors:
      name: Internet check sensors
      description: Ping binary sensors (on = reachable). Pick at least two.
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    plug:
      name: Modem plug
      description: The smart plug the modem/router is plugged into (e.g. IKEA INSPELNING).
      selector:
        entity:
          domain: switch
    offline_minutes:
      name: Offline for
      description: How long all sensors must be offline before the plug is cycled.
      default: 2
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: minutes
    off_seconds:
      name: Off time
      description: How long the plug stays off.
      default: 15
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: seconds
    recovery_minutes:
      name: Recovery time
      description: >
        How long to wait for the internet to come back after switching on, before trying again.
        Modems usually need 3 to 5 minutes to reconnect.
      default: 10
      selector:
        number:
          min: 2
          max: 60
          unit_of_measurement: minutes
    max_attempts:
      name: Quick attempts
      description: How many power cycles to try in a row, one recovery time apart.
      default: 3
      selector:
        number:
          min: 1
          max: 10
    slow_retry_minutes:
      name: Slow retry every
      description: >
        After the quick attempts, keep power-cycling at this interval for as long as the internet
        stays down. Set to 0 to turn slow retries off.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: minutes
    startup_safety:
      name: Turn the plug on when Home Assistant starts
      description: >
        Makes sure the modem is never left off, for example if Home Assistant restarted in the
        middle of a power cycle. If the plug is already on, nothing changes.
      default: true
      selector:
        boolean: {}
    notify_services:
      name: Notify when the internet is back
      description: >
        Notification actions to send an "internet restored" message to after an outage the
        watchdog acted on, for example notify.mobile_app_karels_phone (needs the Home Assistant
        Companion app on the phone). Find the name under Developer tools > Actions by searching
        "mobile_app". Add one per phone, or leave empty for no notifications.
      default: []
      selector:
        text:
          multiple: true

mode: single
max_exceeded: silent

variables:
  sensors: !input internet_sensors
  plug_entity: !input plug
  off_seconds: !input off_seconds
  recovery_minutes: !input recovery_minutes
  max_attempts: !input max_attempts
  slow_retry_minutes: !input slow_retry_minutes
  startup_safety: !input startup_safety
  notify_services: !input notify_services

triggers:
  - trigger: state
    id: offline
    entity_id: !input internet_sensors
    to: "off"
    for:
      minutes: !input offline_minutes
  - trigger: homeassistant
    id: startup
    event: start

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: startup
        sequence:
          - condition: template
            value_template: "{{ startup_safety }}"
          - action: switch.turn_on
            target:
              entity_id: !input plug
    default:
      # Only act when every internet check is offline.
      - condition: template
        value_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}"

      # The outage started when the first sensor went offline.
      - variables:
          outage_start_ts: >-
            {{ expand(sensors) | map(attribute='last_changed') | map('as_timestamp') | min }}

      # Quick attempts, one recovery time apart.
      - repeat:
          sequence:
            - action: logbook.log
              data:
                name: Internet watchdog
                message: >-
                  Internet unreachable - power-cycling {{ plug_entity }}
                  (attempt {{ repeat.index }} of {{ max_attempts | int }})
                entity_id: "{{ plug_entity }}"
            - action: switch.turn_off
              target:
                entity_id: !input plug
            - delay:
                seconds: "{{ off_seconds | int }}"
            - action: switch.turn_on
              target:
                entity_id: !input plug
            - wait_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
              timeout: "{{ (recovery_minutes | int) * 60 }}"
              continue_on_timeout: true
          until:
            - condition: template
              value_template: >-
                {{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count > 0
                   or repeat.index >= (max_attempts | int) }}

      # Safety net: never leave the modem switched off.
      - action: switch.turn_on
        target:
          entity_id: !input plug

      # Slow retries for as long as the internet stays down.
      - if:
          - condition: template
            value_template: >-
              {{ (slow_retry_minutes | int) > 0
                 and expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
        then:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}"
              sequence:
                - wait_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
                  timeout: "{{ (slow_retry_minutes | int) * 60 }}"
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}"
                  then:
                    - action: logbook.log
                      data:
                        name: Internet watchdog
                        message: >-
                          Internet still unreachable - slow retry, power-cycling {{ plug_entity }}
                          (every {{ slow_retry_minutes | int }} min)
                        entity_id: "{{ plug_entity }}"
                    - action: switch.turn_off
                      target:
                        entity_id: !input plug
                    - delay:
                        seconds: "{{ off_seconds | int }}"
                    - action: switch.turn_on
                      target:
                        entity_id: !input plug

      # Internet is back: log it and tell the phones how long it was out.
      - if:
          - condition: template
            value_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
        then:
          - variables:
              outage_minutes: >-
                {{ ((as_timestamp(now()) - (outage_start_ts | float)) / 60) | round(0) | int }}
          - variables:
              outage_text: >-
                {% set m = outage_minutes | int %}
                {% if m >= 60 %}{{ m // 60 }} h {{ m % 60 }} min{% else %}{{ m }} min{% endif %}
          - action: logbook.log
            data:
              name: Internet watchdog
              message: "Internet restored after about {{ outage_text }}"
              entity_id: "{{ plug_entity }}"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: >-
                    {{ repeat.item | trim if (repeat.item | trim).startswith('notify.')
                       else 'notify.' ~ (repeat.item | trim) }}
                  continue_on_error: true
                  data:
                    title: Internet restored
                    message: >-
                      The internet is back after about {{ outage_text }} offline. The watchdog
                      restarted the modem during the outage.
